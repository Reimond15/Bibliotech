{% if is_paginated %}
<div class="paginacion">
  {% if page_obj.has_previous %}<a class="btn sec chico" href="?{{ request.GET.urlencode|cut:'page=' }}&page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}
  <span>Página {{ page_obj.number }} de {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn sec chico" href="?{{ request.GET.urlencode|cut:'page=' }}&page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}
</div>
{% endif %}
